<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Findr</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

  <!-- Shared styles (design system) -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <!-- Screen styles (Mike) -->
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body class="screen">
  <div class="screen__frame">
    <header class="app-bar">
      <a class="app-bar__back" href="../index.html" data-route="home" data-back aria-label="Go back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </header>

    <main class="screen__content">
      <h1>Welcome back</h1>
      <p class="screen__lead">Log in to report, claim and track your items.</p>

      <form class="form" id="login-form" novalidate>
        <div class="field">
          <label class="field__label" for="email">School email</label>
          <input class="input" id="email" name="email" type="email" placeholder="you@student.oauife.edu.ng" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required aria-describedby="email-error">
          <p class="field__error" id="email-error" data-error-for="email" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
          <p class="field__error" id="password-error" data-error-for="password" hidden></p>
        </div>

        <div class="auth__row">
          <label class="checkbox">
            <input class="checkbox__input" type="checkbox" name="remember" checked>
            <span>Remember me</span>
          </label>
          <a class="link" href="#" data-action="forgot-password">Forgot password?</a>
        </div>

        <div class="form-alert" role="alert" data-form-alert hidden></div>

        <div class="auth__actions">
          <button class="btn btn--primary btn--block" type="submit"><span class="btn__label">Log in</span></button>
          <div class="divider" role="separator"><span>or</span></div>
          <button class="btn btn--secondary btn--block" type="button" id="magic-link-button"><span class="btn__label">Email me a magic link</span></button>
          <p class="link-row"><a class="link" href="register.html" data-route="register">New here? Create an account</a></p>
        </div>
      </form>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/core/validators.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/core/mock-api.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
