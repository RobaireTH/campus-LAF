name: campus-laf

services:
  db:
    image: postgres:17-alpine
    container_name: findr-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: findr
    ports:
      - "55433:5432"
    volumes:
      - findr-local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d findr"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  findr-local-db:
